<!DOCTYPE html>
<html lang="fa">
<head>
<meta charset="UTF-8">
<title>qpLand</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
/* ===== انیمیشن ورود صفحه ===== */
@keyframes fadeIn {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: radial-gradient(circle at center, #140022, #000000);
    color: white;
    animation: fadeIn 1s ease;
}

/* ===== نوار بالا ===== */
.navbar {
    position: fixed;
    top: 0;
    width: 100%;
    padding: 15px 0;
    backdrop-filter: blur(10px);
    background: rgba(0,0,0,0.4);
    text-align: center;
    box-shadow: 0 0 20px #6600cc;
    z-index: 100;
}

.navbar a {
    color: white;
    margin: 0 20px;
    text-decoration: none;
    font-size: 18px;
    transition: 0.3s;
    cursor: pointer;
}

.navbar a:hover {
    color: #bb66ff;
    text-shadow: 0 0 10px #bb66ff;
}

/* ===== محتوا ===== */
.container {
    text-align: center;
    margin-top: 150px;
}

h1 {
    font-size: 50px;
    text-shadow:
        0 0 5px #fff,
        0 0 15px #bb66ff,
        0 0 30px #6600cc;
    margin-bottom: 40px;
}

/* ===== دکمه شروع ===== */
.button-main {
    padding: 15px 30px;
    font-size: 18px;
    background: #6600cc;
    border: none;
    border-radius: 30px;
    color: white;
    cursor: pointer;
    position: relative;
    overflow: hidden;
    transition: 0.3s;
}

.button-main:hover {
    background: #bb66ff;
    box-shadow: 0 0 20px #bb66ff;
}

/* ripple effect */
.ripple {
    position: absolute;
    border-radius: 50%;
    background: rgba(255,255,255,0.5);
    transform: scale(0);
    animation: rippleEffect 0.6s linear;
}

@keyframes rippleEffect {
    to {
        transform: scale(4);
        opacity: 0;
    }
}

/* ===== پنجره popup ===== */
.popup {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    background: rgba(255,255,255,0.05);
    backdrop-filter: blur(10px);
    padding: 30px 40px;
    border-radius: 20px;
    text-align: center;
    box-shadow: 0 0 20px #bb66ff, 0 0 40px #6600cc;
    z-index: 1000;
    display: none; /* مخفی در ابتدا */
}

/* دکمه کپی و بستن */
.copy-btn, .close-btn {
    padding: 10px 20px;
    margin: 10px;
    border: none;
    border-radius: 15px;
    background: #6600cc;
    color: white;
    font-size: 16px;
    cursor: pointer;
    transition: 0.3s;
}

.copy-btn:hover, .close-btn:hover {
    background: #bb66ff;
    box-shadow: 0 0 20px #bb66ff;
}

/* overlay */
.overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,0.7);
    z-index: 900;
    display: none;
}

/* ===== آیکون دکمه ثابت ===== */
.icon-btn {
    width: 80px;
    height: 80px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 30px;
    color: white;
    text-decoration: none;
    border-radius: 20px;
    background: rgba(255,255,255,0.05);
    backdrop-filter: blur(10px);
    box-shadow:
        0 0 10px #8a2be2,
        0 0 30px #6a0dad,
        inset 0 0 10px rgba(255,255,255,0.2);
    transition: 0.3s;
    position: absolute;
}

.icon-btn:hover {
    transform: translateY(-10px) scale(1.1);
    box-shadow:
        0 0 20px #ffffff,
        0 0 40px #8a2be2,
        0 0 60px #6a0dad;
}

/* ===== جایگذاری دکمه ها ===== */
#btn1 { top: 200px; left: 100px; }
#btn2 { top: 200px; right: 100px; }
#btn3 { bottom: 50px; left: 50%; transform: translateX(-50%); }

</style>
</head>

<body>

<!-- نوار بالا -->
<div class="navbar">
    <a href="Game.html">بازی‌ها</a>
    <a href="Contact.html">درباره ما</a>
    <a onclick="window.close();">خروج</a>
</div>

<!-- محتوا -->
<div class="container">
    <h1>parsa_qxp</h1>

    <button class="button-main" onclick="openPopup()">تماس</button>
</div>

<!-- دکمه آیکونی ثابت -->
<a href="Rank.html" class="icon-btn" id="btn1">
    <i class="fas fa-rocket"></i>
</a>

<a href="Game.html" class="icon-btn" id="btn2">
    <i class="fas fa-gamepad"></i>
</a>

<a href="Contact.html" class="icon-btn" id="btn3">
    <i class="fas fa-user"></i>
</a>

<!-- overlay -->
<div class="overlay" id="overlay"></div>

<!-- popup -->
<div class="popup" id="popup">
    <h2>Phone Number</h2>
    <p id="copyText">09945158877</p>
    <button class="copy-btn" onclick="copyTextFunc()">کپی متن</button>
    <button class="close-btn" onclick="closePopup()">بستن</button>
</div>

<script>
/* ripple effect برای دکمه‌ها */
document.querySelectorAll(".button-main").forEach(button => {
    button.addEventListener("click", function(e) {
        const circle = document.createElement("span");
        circle.classList.add("ripple");
        const rect = button.getBoundingClientRect();
        circle.style.left = e.clientX - rect.left + "px";
        circle.style.top = e.clientY - rect.top + "px";
        button.appendChild(circle);
        setTimeout(() => circle.remove(), 600);
    });
});

/* باز و بسته کردن popup */
function openPopup() {
    document.getElementById("popup").style.display = "block";
    document.getElementById("overlay").style.display = "block";
}

function closePopup() {
    document.getElementById("popup").style.display = "none";
    document.getElementById("overlay").style.display = "none";
}

/* کپی کردن متن */
function copyTextFunc() {
    const text = document.getElementById("copyText").innerText;
    navigator.clipboard.writeText(text).then(() => {
        alert("متن کپی شد: " + text);
    });
}
</script>

</body>
</html>
