<!DOCTYPE html>
<html>
<head>
<title>Games</title>
</head>
<style>

@keyframes fadeIn {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: radial-gradient(circle at center, #140022, #000000);
    color: white;
    animation: fadeIn 1s ease;
}

.card {
    background: rgba(255, 255, 255, 0.08);
    width: 250px;
    margin: 40px auto;
    padding: 20px;
    border-radius: 15px;
    backdrop-filter: blur(10px);
    transition: 0.3s;
    position: relative;
    overflow: hidden;
    cursor: pointer;
}

.card:hover {
    transform: scale(1.1);
    box-shadow: 0 0 30px #bb66ff;
}

h1 {
    font-size: 50px;
    text-shadow:
        0 0 5px #fff,
        0 0 15px #bb66ff,
        0 0 30px #6600cc;
    margin-bottom: 40px;
}
p {
    font-size: 25px;
    text-shadow:
        0 0 5px #fff,
        0 0 15px #bb66ff,
        0 0 30px #6600cc;
    margin-bottom: 40px;
}
.button-main {
    padding: 15px 30px;
    font-size: 18px;
    background: #6600cc;
    border: none;
    border-radius: 30px;
    color: white;
    cursor: pointer;
    position: relative;
    overflow: hidden;
    transition: 0.3s;
    margin: 20px;
}

.button-main:hover {
    background: #bb66ff;
    box-shadow: 0 0 20px #bb66ff;
}
.container {
    text-align: center;
    margin-top: 150px;
}



</style>
<body>

<div class="container">
    <a href="index.html">
        <button class="button-main">Home</button>
        <i class="fas fa-home"></i>
    </a>
</div>



<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<a href="https://www.minecraft.net/en-us">
        <div class="card">
            <h1>Minecraft</h1>
            <p>ساخت و بقا حرفه‌ای</p>
        </div>
    </a>
<a href="https://rsmta.ir/">
        <div class="card">
            <h1>MTA</h1>
            <p>رول پلی و نقش آفرینی</p>
        </div>
    </a>
<a href="https://www.counter-strike.net/cs2">
        <div class="card">
            <h1>Cs2</h1>
            <p>شوتر و مبارزه ای</p>
        </div>
    </a>
<a href="https://www.rockstargames.com/">
        <div class="card">
            <h1>GTA</h1>
            <p>رول پلی و نقش آفرینی</p>
        </div>
    </a>

</body>
</html>
